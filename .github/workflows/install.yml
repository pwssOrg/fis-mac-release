name: Install FIS

on:
    workflow_dispatch:

jobs:
    run-install:
        runs-on: macOS
        permissions:
            contents: read
        steps:
            - name: Checkout
                uses: actions/checkout@v4

            - name: Install FIS
                run: |
                    chmod +x ./install_integrity_hash_macos.sh
                    ./install_integrity_hash_macos.sh