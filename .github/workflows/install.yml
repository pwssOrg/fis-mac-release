name: Install FIS (Script-Only)

on:
  workflow_dispatch:

jobs:
  run-install:
    runs-on: macos-latest
    env:
      DB_USER: integrity
      DB_PASSWORD: integrity123
      INSTALL_JAVA: true

    steps:
      - uses: actions/checkout@v4

      - name: Run Installer
        run: |
          chmod +x pwss_installer/scripts/install_integrity_hash_macos.sh
          ./pwss_installer/scripts/install_integrity_hash_macos.sh
