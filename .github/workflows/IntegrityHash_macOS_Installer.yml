name: Build IntegrityHash macOS Installer

on:
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: macos-latest

    steps:
      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Download DMG artifact using API + PAT (works cross-run)
      # ----------------------------------------------------------
      - name: Download IntegrityHash.dmg from external workflow run
        env:
          RUN_ID: "20008700690"
          REPO: "pwssOrg/fis-mac-release-playground"
          TOKEN: ${{ secrets.ARTIFACT_TOKEN }}
        run: |
          echo "Fetching artifact list…"
          curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts \
            -o artifacts.json

          ARTIFACT_ID=$(jq -r '.artifacts[] | select(.name=="IntegrityHash.dmg") | .id' artifacts.json)

          if [ -z "$ARTIFACT_ID" ]; then
            echo "ERROR: Artifact 'IntegrityHash.dmg' not found!"
            exit 1
          fi

          echo "Downloading artifact ZIP…"
          curl -L \
            -H "Authorization: Bearer $TOKEN" \
            -o artifact.zip \
            https://api.github.com/repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip

          unzip artifact.zip -d artifact_contents

      # ----------------------------------------------------------
      # Verify DMG hash
      # ----------------------------------------------------------
      - name: Verify DMG hash
        run: |
          EXPECTED_HASH="2ddb1f148f533855afea27564a581dd06fd9d7bd5e95cea372b61a169676b337" # DMG Hash
          
          DMG_FILE=$(find artifact_contents -name "*.dmg" | head -1)

          if [ -z "$DMG_FILE" ]; then
            echo "ERROR: No DMG found!"
            exit 1
          fi

          # Export DMG_FILE to env for next steps
          echo "DMG_FILE=$DMG_FILE" >> $GITHUB_ENV

          ACTUAL_HASH=$(shasum -a 256 "$DMG_FILE" | awk '{print $1}')
          echo "Expected: $EXPECTED_HASH"
          echo "Actual:   $ACTUAL_HASH"

          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "ERROR: DMG hash does not match!"
            exit 1
          fi

          echo "DMG hash verified successfully."

      # ----------------------------------------------------------
      # Copy verified DMG to installer directory
      # ----------------------------------------------------------
      - name: Copy verified DMG to installer directory
        run: |
          mkdir -p pwss_installer/dmg
          cp "$DMG_FILE" pwss_installer/dmg/IntegrityHash.dmg
          echo "DMG copied to pwss_installer/dmg:"
          ls -l pwss_installer/dmg

      # ----------------------------------------------------------
      # Ensure scripts are executable
      # ----------------------------------------------------------
      - name: Make install scripts executable
        run: |
          chmod +x pwss_installer/install_integrity_hash_macos.sh
          chmod +x pwss_installer/Scripts/preinstall
          chmod +x pwss_installer/Scripts/postinstall

      # ----------------------------------------------------------
      # Build the PKG installer
      # ----------------------------------------------------------
      - name: Build Installer
        run: |
          mkdir -p payload/usr/local/pwss_installer

          cp pwss_installer/install_integrity_hash_macos.sh payload/usr/local/pwss_installer/
          cp -R pwss_installer/dmg payload/usr/local/pwss_installer/dmg

          pkgbuild \
            --root payload \
            --scripts pwss_installer/Scripts \
            --identifier com.pwss.integrityhash \
            --version 1.0.0 \
            --install-location /usr/local/pwss_installer \
            IntegrityHashInstaller.pkg

      # ----------------------------------------------------------
      # Upload final PKG
      # ----------------------------------------------------------
      - name: Upload installer package
        uses: actions/upload-artifact@v4
        with:
          name: IntegrityHashInstaller
          path: IntegrityHashInstaller.pkg

#📁 Repository structure that the workflow is based on
#pwss_installer/
# ├── install_integrity_hash_macos.sh
# ├── dmg/
# │    └── IntegrityHash.dmg   (downloaded automatically)
# └── Scripts/
#      ├── preinstall
#      └── postinstall
