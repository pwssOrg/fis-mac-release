name: Create PKG Installer for IntegrityHash
on:
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: macos-latest

    env:
      SSL_FILE_INTEGRITY_SCANNER: ${{ secrets.SSL_FILE_INTEGRITY_SCANNER }}
      TRUSTSTORE_FIS_GUI: ${{ secrets.TRUSTSTORE_FIS_GUI }}

    steps:
      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Download DMG artifact
      # ----------------------------------------------------------
      - name: Download IntegrityHash.dmg
        env:
          RUN_ID: "20008700690"
          REPO: "pwssOrg/fis-mac-release-playground"
          TOKEN: ${{ secrets.ARTIFACT_TOKEN }}
        run: |
          echo "Fetching artifact list…"
          curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts \
            -o artifacts.json

          ARTIFACT_ID=$(jq -r '.artifacts[] | select(.name=="IntegrityHash.dmg") | .id' artifacts.json)
          if [ -z "$ARTIFACT_ID" ]; then
            echo "Artifact not found!"
            exit 1
          fi

          echo "Downloading artifact ID: $ARTIFACT_ID"
          curl -L \
            -H "Authorization: Bearer $TOKEN" \
            -o artifact.zip \
            https://api.github.com/repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip

          unzip artifact.zip -d artifact_contents

      # ----------------------------------------------------------
      # Verify DMG hash
      # ----------------------------------------------------------
      - name: Verify DMG hash
        run: |
          EXPECTED_HASH="2ddb1f148f533855afea27564a581dd06fd9d7bd5e95cea372b61a169676b337"
          DMG_FILE=$(find artifact_contents -name "*.dmg" | head -1)

          if [ -z "$DMG_FILE" ]; then
            echo "DMG file not found!"
            exit 1
          fi

          echo "DMG_FILE=$DMG_FILE" >> $GITHUB_ENV

          ACTUAL_HASH=$(shasum -a 256 "$DMG_FILE" | awk '{print $1}')
          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "DMG hash mismatch!"
            exit 1
          fi

      # ----------------------------------------------------------
      # Prepare installer payload
      # ----------------------------------------------------------
      - name: Prepare installer payload
        run: |
          # Create correct root-relative payload
          mkdir -p payload/usr/local/pwss_installer

          # Copy installer script
          cp pwss_installer/install_integrity_hash_macos.sh payload/usr/local/pwss_installer/

          # Copy integrity_hash_enviroment script
          cp -R pwss_installer/integrity_hash_enviroment payload/usr/local/pwss_installer/

          # Copy DMG
          mkdir -p payload/usr/local/pwss_installer/dmg
          cp "$DMG_FILE" payload/usr/local/pwss_installer/dmg/

          # Copy PostgreSQL-related files
          cp -R pwss_installer/psql_files payload/usr/local/pwss_installer/

          # Ensure executable permissions inside payload
          chmod +x payload/usr/local/pwss_installer/install_integrity_hash_macos.sh
          chmod +x payload/usr/local/pwss_installer/integrity_hash_enviroment

          # Create scripts folder
          mkdir -p payload/usr/local/pwss_installer/scripts

          # Copy pre & post install scripts
          cp -R pwss_installer/scripts payload/usr/local/pwss_installer/

          # Ensure installer scripts are executable BEFORE pkgbuild reads them
          chmod +x payload/usr/local/pwss_installer/scripts/preinstall
          chmod +x payload/usr/local/pwss_installer/scripts/postinstall

      # ----------------------------------------------------------
      # Build PKG installer
      # ----------------------------------------------------------
      - name: Build Installer
        run: |
          # Architecture detection for optional later use
          ARCH=$(uname -m)
          if [[ "$ARCH" == "arm64" ]]; then
            PGDATA_DIR="/opt/homebrew/var/postgresql@17"
          else
            PGDATA_DIR="/usr/local/var/postgresql@17"
          fi

          echo "Architecture: $ARCH"
          echo "PostgreSQL data directory: $PGDATA_DIR"

         
          # Build package correctly
          pkgbuild \
          --root payload/usr/local/pwss_installer \
          --install-location /usr/local/pwss_installer \
          --scripts payload/usr/local/pwss_installer/scripts \
          --identifier com.pwss.integrityhash \
          --version 1.0.0 \
          IntegrityHashInstaller.pkg

      # ----------------------------------------------------------
      # Upload final PKG
      # ----------------------------------------------------------
      - name: Upload installer package
        uses: actions/upload-artifact@v4
        with:
          name: IntegrityHashInstaller
          path: IntegrityHashInstaller.pkg

# 📁 Repository structure that the workflow is based on
# pwss_installer/
# ├── install_integrity_hash_macos.sh
# ├── integrity_hash_enviroment        
# ├── dmg/
# │   └── IntegrityHash.dmg            
# ├── scripts/                        
# │   ├── preinstall
# │   └── postinstall
# └── psql_files/
#     ├── psql/
#     │   ├── cert/
#     │   │   ├── server.crt
#     │   │   └── server.key
#     │   └── pass/
#     │        └── avocado
#     └── postgresql.conf
