name: Build IntegrityHash DMG

on:
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Make start script executable
        run: chmod +x file_integrity_scanner_app/macos/start_integrity_hash

      - name: Download JAR files from another repository
        run: |
          curl -L -o integrity_hash-1.2.3.jar https://github.com/pwssOrg/File-Integrity-GUI/releases/download/v1.2.3/integrity_hash-1.2.3.jar
          curl -L -o File-Integrity-Scanner-1.8.5.jar https://github.com/pwssOrg/File-Integrity-Scanner/releases/download/v1.8.5/File-Integrity-Scanner-1.8.5.jar


      - name: Verify SHA256 hash for integrity_hash-1.2.3
        run: |
          # Expected SHA256 hash of jar1.jar (replace with the actual expected hash)
          expected_hash="e04ca51dde652cc70db6cdb96e0baca591e3bdc76dafd117cb21804a23c9e5d8"
          
          # Calculate the actual SHA256 hash of the downloaded jar file
          actual_hash=$(sha256sum integrity_hash-1.2.3.jar | awk '{print $1}')
          
          # Compare the actual and expected hashes
          if [ "$actual_hash" != "$expected_hash" ]; then
            echo "SHA256 hash mismatch for jar1.jar: expected $expected_hash, got $actual_hash"
            exit 1  # Exit with failure if hashes don't match
          else
            echo "SHA256 hash for jar1.jar is valid"
          fi

      - name: Verify SHA256 hash for File-Integrity-Scanner-1.8.5
        run: |
          # Expected SHA256 hash of jar2.jar (replace with the actual expected hash)
          expected_hash="ae8b2900e402a24268c5b1e31c49f1e613dfc3c27013bc98851d9dcfe3b762be"
          
          # Calculate the actual SHA256 hash of the downloaded jar file
          actual_hash=$(sha256sum File-Integrity-Scanner-1.8.5.jar | awk '{print $1}')
          
          # Compare the actual and expected hashes
          if [ "$actual_hash" != "$expected_hash" ]; then
            echo "SHA256 hash mismatch for jar2.jar: expected $expected_hash, got $actual_hash"
            exit 1  # Exit with failure if hashes don't match
          else
            echo "SHA256 hash for jar2.jar is valid"
          fi

      - name: Create App bundle with Info.plist and icon
        run: |
          # Create folder structure for .app
          mkdir -p IntegrityHash.app/Contents/MacOS
          mkdir -p IntegrityHash.app/Contents/Resources
          mkdir -p IntegrityHash.app/Contents/Resources/frontend
          mkdir -p IntegrityHash.app/Contents/Resources/local_backend
          
          # Copy start script into app folder
          cp file_integrity_scanner_app/macos/start_integrity_hash IntegrityHash.app/Contents/MacOS/IntegrityHash
          chmod +x IntegrityHash.app/Contents/MacOS/IntegrityHash

          # Copy app folder and options folder
          cp -r file_integrity_scanner_app/options IntegrityHash.app/Contents/Resources/frontend/
          cp -r file_integrity_scanner_app/app_storage IntegrityHash.app/Contents/Resources/frontend/

          # Copy Frontend Jar into app folder
          cp integrity_hash-1.2.3.jar IntegrityHash.app/Contents/Resources/frontend/
          chmod +x IntegrityHash.app/Contents/Resources/frontend/integrity_hash-1.2.3.jar

          # Copy Backend Jar into app folder
          cp File-Integrity-Scanner-1.8.5.jar IntegrityHash.app/Contents/Resources/local_backend/
          chmod +x IntegrityHash.app/Contents/Resources/local_backend/File-Integrity-Scanner-1.8.5.jar
          
          # Copy icon for app
          cp file_integrity_scanner_app/MyIcon.icns IntegrityHash.app/Contents/Resources/MyIcon.icns


          cat <<EOF > IntegrityHash.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
          <key>CFBundleName</key>
          <string>IntegrityHash</string>
          <key>CFBundleIdentifier</key>
          <string>org.pwss.integrityhash</string>
          <key>CFBundleVersion</key>
          <string>1.5</string>
          <key>CFBundleExecutable</key>
          <string>IntegrityHash</string>
          <key>CFBundleIconFile</key>
          <string>MyIcon</string>
          <key>CFBundleVersion</key>
          <string>1.5</string>
          </dict>
          </plist>
          EOF

      - name: Build DMG
        run: |
          mkdir dmg_temp
          cp -R IntegrityHash.app dmg_temp/
          hdiutil create -volname "Integrity Hash" -srcfolder dmg_temp -ov -format UDZO IntegrityHash.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: IntegrityHash.dmg
          path: IntegrityHash.dmg
          retention-days: 7
