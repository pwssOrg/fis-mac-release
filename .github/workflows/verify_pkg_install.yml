name: Test PKG Installer for IntegrityHash

on:
  workflow_dispatch:

jobs:
  test-pkg:
    runs-on: macos-latest
    env:
      DB_USER: The_Dodo_Bird
      DB_PASSWORD: happy_smiley

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Download PKG artifact (zip) using PAT
      - name: Download PKG zip artifact
        env:
          TOKEN: ${{ secrets.ARTIFACT_TOKEN }}
        run: |
          ARTIFACT_URL="https://api.github.com/repos/pwssOrg/fis-mac-release/actions/artifacts/4840616131/zip"
          curl -L -H "Authorization: Bearer $TOKEN" -o IntegrityHash.zip $ARTIFACT_URL
          unzip -o IntegrityHash.zip -d artifact_contents

      # 3️⃣ Locate PKG and save path
      - name: Locate PKG
        run: |
          PKG_FILE=$(find artifact_contents -name "*.pkg" | head -1)
          if [ -z "$PKG_FILE" ]; then
            echo "ERROR: PKG file not found in artifact!"
            exit 1
          fi
          echo "PKG located at: $PKG_FILE"
          mv "$PKG_FILE" /tmp/IntegrityHashInstaller.pkg
          echo "PKG_PATH=/tmp/IntegrityHashInstaller.pkg" >> $GITHUB_ENV

      # 4️⃣ Verify PKG hash
      - name: Verify PKG hash
        run: |
          EXPECTED_HASH="dac3c715f97f29b35754fe58d8f3d12dada61bfae4e1a36ec73eb437492d7be6"
          ACTUAL_HASH=$(shasum -a 256 "$PKG_PATH" | awk '{print $1}')
          echo "Expected: $EXPECTED_HASH"
          echo "Actual:   $ACTUAL_HASH"

          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "ERROR: PKG hash does not match!"
            exit 1
          fi
          echo "PKG hash verified successfully."

      # 5️⃣ Test PKG install with mock DB_USER/DB_PASSWORD
      - name: Verify PKG install
        env:
          DB_USER: testuser
          DB_PASSWORD: testpass
        run: |
          mkdir -p /tmp/test-install
          sudo installer -pkg "$PKG_PATH" -target /tmp/test-install -verboseR -dumplog | tee installer.log

      # 6️⃣ Upload log artifact for preinstall :)
      - name: Upload preinstall log
        uses: actions/upload-artifact@v4
        with:
           name: preinstall-log
           path: /tmp/preinstall_debug.log
      
      # 7️⃣ Upload log artifact for postinstall :)
      - name: Upload postinstall log
        uses: actions/upload-artifact@v4
        with:
           name: postinstall-log
           path: /tmp/postinstall_debug.log
           

      # 8️⃣ List installed files
      - name: List installed files
        run: ls -R /tmp/test-install
