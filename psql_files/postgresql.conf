# ------------------------------------------------------------
# PostgreSQL 17 - Optimized for macOS + 16GB RAM + SSL Enabled
# ------------------------------------------------------------

# ---- File Locations ----
data_directory = '/opt/homebrew/var/postgresql@17'
hba_file = '/opt/homebrew/var/postgresql@17/pg_hba.conf'
ident_file = '/opt/homebrew/var/postgresql@17/pg_ident.conf'
unix_socket_directories = '/tmp'

# ---- Connections ----
listen_addresses = '*'
port = 26556
max_connections = 100

# ------------------------------------------------------------
# MEMORY OPTIMIZATIONS (16GB system RAM)
# ------------------------------------------------------------

# Postgres rekommenderar 25% av RAM till shared_buffers.
shared_buffers = 4GB

# work_mem används per query/node, håll det rimligt.
work_mem = 64MB

# För VACUUM och reindex operations.
maintenance_work_mem = 1GB

# Cache hint för query planner (≈50% av RAM är bra).
effective_cache_size = 8GB

# macOS hanterar huge pages dåligt – behåll default.
huge_pages = try

# ------------------------------------------------------------
# WAL / CHECKPOINT OPTIMIZATION
# ------------------------------------------------------------
wal_level = replica
wal_buffers = 64MB
max_wal_size = 4GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

fsync = on
synchronous_commit = on
full_page_writes = on

# ------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_min_duration_statement = 250
log_line_prefix = '%m [%p] '

# ------------------------------------------------------------
# PLANNER / PERFORMANCE
# ------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
max_parallel_workers_per_gather = 4
max_worker_processes = 8
max_parallel_workers = 8

# ------------------------------------------------------------
# AUTOVACUUM
# ------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 10s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ------------------------------------------------------------
# SSL SETTINGS 
# ------------------------------------------------------------
ssl = on

# Enforce TLS 1.3
ssl_min_protocol_version = 'TLSv1.3'

ssl_ciphers = 'TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256'
ssl_prefer_server_ciphers = on

ssl_cert_file = '/opt/homebrew/var/postgresql@17/server.crt'
ssl_key_file = '/opt/homebrew/var/postgresql@17/server.key'
ssl_ca_file = '/opt/homebrew/var/postgresql@17/root.crt'

# Script that returns the passphrase for server.key
ssl_passphrase_command = '/opt/homebrew/var/postgresql@17/ssl_passphrase.sh'
ssl_passphrase_command_supports_reload = on



# ------------------------------------------------------------
# PASSWORD ENCRYPTION
# ------------------------------------------------------------
password_encryption = scram-sha-256

# ------------------------------------------------------------
# LOCALE / MISC
# ------------------------------------------------------------
datestyle = 'iso, mdy'
timezone = 'Europe/Stockholm'
default_text_search_config = 'pg_catalog.swedish'

# ------------------------------------------------------------
# EXTENSIONS (optional)
# ------------------------------------------------------------
# shared_preload_libraries = 'pg_stat_statements'
# pg_stat_statements.max = 25000
# pg_stat_statements.track = all
